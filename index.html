<style>
/* Layout: sticky case-file header + last-roll strip, tabbed single column for phones, two columns on wide screens. Single dark theme by choice. */
:root{

*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);font-size:16px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}

h2{font-size:22px}

.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

function shortest(from,to,pilot,captain){
  const adj={};LOCS.forEach(l=>adj[l]=[]);
  EDGES.forEach(([a,b,d])=>{adj[a].push([b,d]);adj[b].push([a,d]);});
  if(pilot)AIR.forEach(a=>AIR.forEach(b=>{if(a!==b)adj[a].push([b,1]);}));
  // sea captain: 1 day between these ports, 2 days New York <-> New Orleans
  if(captain){SEA.forEach(a=>SEA.forEach(b=>{if(a!==b)adj[a].push([b,1]);}));adj["New York"].push(["New Orleans",2]);adj["New Orleans"].push(["New York",2]);}
  const dist={},prev={},q=new Set(LOCS);LOCS.forEach(l=>dist[l]=Infinity);dist[from]=0;
  while(q.size){let u=null;q.forEach(x=>{if(u===null||dist[x]<dist[u])u=x;});q.delete(u);if(u===to)break;
    adj[u].forEach(([v,d])=>{if(dist[u]+d<dist[v]){dist[v]=dist[u]+d;prev[v]=u;}});}
  const path=[];let c=to;while(c){path.unshift(c);c=prev[c];}
  return {days:dist[to],path};
}

async function playDice(l){
  const el=$("#anim");if(!el)return;
  const dice=(l.dice||[]).map(Number).filter(n=>n>=1);if(!dice.length)return;
  el.innerHTML=`<div class="anim-wrap" data-a="animClose" role="status" aria-live="polite">

    <div class="anim-res" id="animRes"></div></div>`;
  const row=$("#animRow");
  for(let i=0;i<dice.length;i++){
    const v=dice[i];const slot=document.createElement("div");slot.className="anim-die";
    if(v>6){slot.innerHTML=`<div class="flat">${v}</div>`;row.appendChild(slot);continue;}
    slot.innerHTML=cubeHtml();row.appendChild(slot);
    const cube=slot.firstChild;const [fx,fy]=FACE_ROT[v];

    const sx=Math.random()<.5?-1:1,sy=Math.random()<.5?-1:1;

    await wait(20);
    cube.style.transition="transform 900ms cubic-bezier(.2,.75,.25,1)";
    cube.style.transform=`rotateX(${fx+sx*720}deg) rotateY(${fy+sy*720}deg)`;
    slot.classList.add("toss");

}

}

/* ---------- backend calls ---------- */
async function rpc(fn,args){const {data,error}=await sb.rpc(fn,args);if(error)throw error;return data;}
function q(fn){
  pending++;
  chain=chain.then(fn).catch(e=>{conn("errore di salvataggio","dead");console.error(e);}).finally(()=>{pending--;if(!pending){ping();refetchSoon(50);}});
  return chain;
}
function ping(){if(chan)chan.send({type:"broadcast",event:"ping",payload:{}}).catch(()=>{});}
function refetchSoon(ms){clearTimeout(refetchT);refetchT=setTimeout(refetch,ms==null?200:ms);}
async function refetch(){
  if(pending){return;}
  try{
    if(role==="narr"&&TOKEN){
      const d=await rpc("narr_get",{p_token:TOKEN});if(pending)return;
      S=merge(freshState(),d.state||{});CH=d.chars||{};RAWLOG=d.log||[];LIB=merge({locs:{}},d.lib||{});setGame(d.game_id);migrateNames();
      if(!VIEWCODE)SCR.narrCode();
    }else if(role==="player"&&Object.keys(CODES).length){
      const res={},add={};let gid=null,st=null,log=null;
      for(const [slot,code] of Object.entries({...CODES})){
        try{const d=await rpc("player_get",{p_code:code});
          if(gid&&d.game_id!==gid){delete CODES[slot];continue;}
          gid=d.game_id;st=d.state;log=d.log;res[d.slot]={...d.data,slot:d.slot};
          if(d.slot!==slot){delete CODES[slot];CODES[d.slot]=code;}
          (d.linked||[]).forEach(l=>{if(CODES[l.slot]!==l.code)add[l.slot]=l.code;});
        }catch(e){if(/non valido/.test(String(e&&e.message||"")))delete CODES[slot];else throw e;}
      }
      if(pending)return;
      if(!gid){CODES={};saveCodes();landingErr=Object.keys(MY).length?"I tuoi personaggi non sono più in gioco: chiedi un nuovo codice al Narratore.":"Codice non valido. Ricontrollalo con il Narratore.";
        MY={};MINE=null;role=null;isNarr=false;mode="landing";S=null;leaveGame();render();return;}
      const grew=Object.keys(add).length>0;Object.assign(CODES,add);saveCodes();
      S=merge(freshState(),st||{});MY=res;if(!MY[ACT])ACT=Object.keys(MY)[0];MINE=MY[ACT];RAWLOG=log||[];
      if(!rollForm._init){rollForm._init=1;rollForm.who=ACT;rollForm.mod=classBonus(MINE);}
      setGame(gid);setTimeout(()=>{trackMe();sayHere();},0);
      if(grew){busyMsg="Il Narratore ti ha assegnato un altro personaggio.";setTimeout(()=>{busyMsg="";render();},4000);refetchSoon(0);}
    }else if(role==="screen"&&VIEW){await refetchScreen();if(pending)return;}
    showConn();mode="ready";
  }catch(e){
    const msg=String(e&&e.message||"");
    if(/non valido/.test(msg)){
      if(role==="narr"){lsSet("4agoo-narr",null);TOKEN=null;landingErr="Codice Narratore non valido.";}
      else if(role==="screen"){lsSet("4agoo-view",null);VIEW=null;landingErr="Codice dello schermo non valido.";}
      else{CODES={};saveCodes();landingErr="Codice non valido. Ricontrollalo con il Narratore.";MINE=null;MY={};}
      role=null;isNarr=false;mode="landing";S=null;leaveGame();
    }else conn("connessione persa","dead");
  }
  render();
}
// renamed locations: old saved names are moved to the new ones once, by the narrator
const RENAMED={"The Backwoods":"I Boschi","Big Cypress Swamp":"Palude di Big Cypress","Catskill Mountains":"Monti Catskill"};
function migrateNames(){
  if(!isNarr||!S)return;const p={};
  for(const [o,n] of Object.entries(RENAMED)){
    if(S.loc===o)p.loc=n;
    if(S.checks&&S.checks[o]){p.checks=Object.assign(p.checks||{},{[n]:S.checks[o],[o]:null});}
    if(S.recUsed&&S.recUsed[o]){p.recUsed=Object.assign(p.recUsed||{},{[n]:S.recUsed[o],[o]:null});}
    if(S.tomorrow&&S.tomorrow.loc===o)p.tomorrow={...S.tomorrow,loc:n};
    if(S.enc&&S.enc.loc===o)p.enc={...S.enc,loc:n};
    if(LIB.locs&&LIB.locs[o]&&!LIB.locs[n]){const d=LIB.locs[o];LIB.locs[n]=d;delete LIB.locs[o];
      q(()=>rpc("narr_set_lib",{p_token:TOKEN,p_patch:{locs:{[n]:d}}}));q(()=>rpc("narr_set_lib",{p_token:TOKEN,p_patch:{locs:{[o]:null}}}));}
  }
  if(Object.keys(p).length)upd(p);
}
function setGame(id){
  if(gameId===id&&chan)return;
  leaveGame();gameId=id;
  chan=sb.channel("g-"+id,{config:{broadcast:{self:false},presence:{key:role==="player"?("p-"+uid()):"narr"}}});
  chan.on("broadcast",{event:"ping"},()=>refetchSoon())
      .on("broadcast",{event:"here"},m=>{const p=m&&m.payload||{};const ss=Array.isArray(p.slots)?p.slots:(p.slot?[p.slot]:[]);if(!isNarr||!ss.length)return;
        const was=ss.every(isOnline)&&p.dev&&DEVS[p.dev];ss.forEach(s=>SEEN[s]=Date.now());noteDev(p.dev,ss);if(!was)render();})
      .on("broadcast",{event:"who"},()=>{if(role==="player")sayHere();})
      .on("presence",{event:"sync"},()=>{const st=chan.presenceState();ONLINE=new Set();Object.values(st).forEach(arr=>arr.forEach(m=>{const ss=Array.isArray(m.slots)?m.slots:(m.slot?[m.slot]:[]);ss.forEach(s=>ONLINE.add(s));noteDev(m.dev,ss);}));if(isNarr)render();})
      .subscribe(status=>{RT=status;if(status==="SUBSCRIBED"){tracked=null;trackMe();sayHere();if(isNarr)chan.send({type:"broadcast",event:"who",payload:{}}).catch(()=>{});}showConn();});
}
let tracked=null,RT="";const SEEN={};
// fallback heartbeat over broadcast, in case presence is unavailable: players announce themselves on join, on request and every 25 s
function mySlots(){return Object.keys(MY).sort();}
function sayHere(){if(chan&&role==="player"&&mySlots().length&&RT==="SUBSCRIBED")chan.send({type:"broadcast",event:"here",payload:{slots:mySlots(),dev:DEV}}).catch(()=>{});}
function noteDev(dev,slots){if(!dev||!Array.isArray(slots))return;DEVS[dev]={slots:slots.filter(s=>SLOTS.includes(s)),ts:Date.now()};}
function presentDevs(){return Object.entries(DEVS).filter(([,d])=>Date.now()-d.ts<60000&&d.slots.length);}
function isOnline(slot){return ONLINE.has(slot)||(SEEN[slot]&&Date.now()-SEEN[slot]<60000);}
setInterval(sayHere,25000);
function showConn(){if(!role)return;if(RT==="SUBSCRIBED")conn("in tempo reale","me");else conn("aggiornamento ogni 15 s","");}
// announce this player once per connection (re-sent only if the slot changes): repeated track() calls hit Supabase's presence rate limit
function trackMe(){const k=mySlots().join(",");if(!chan||role!=="player"||!k||tracked===k)return;tracked=k;chan.track({slots:mySlots(),dev:DEV}).catch(()=>{tracked=null;});}
function leaveGame(){tracked=null;RT="";if(chan){try{sb.removeChannel(chan);}catch(e){}chan=null;}gameId=null;ONLINE=new Set();}

/* local-first writes */
function upd(patch){
  S=merge(S,patch);render();
  if(role==="narr")q(()=>rpc("narr_set_state",{p_token:TOKEN,p_patch:patch,p_replace:false}));
  else{const f={};["last","xp","minions","foes"].forEach(k=>{if(k in patch)f[k]=patch[k];});if(patch.combat&&patch.combat.cres)f.cres=patch.combat.cres;
    if(Object.keys(f).length)q(()=>rpc("player_set_state",{p_code:anyCode(),p_patch:f}));}
}
function invOf(slot){if(!isNarr)return MY[slot]||null;return CH[slot]&&CH[slot].data&&CH[slot].data.cls?CH[slot].data:null;}
function invUpd(slot,patch){
  if(!isNarr){if(!MY[slot])return;MY[slot]=merge(MY[slot],patch);if(slot===ACT)MINE=MY[slot];render();const code=CODES[slot];q(()=>rpc("player_set_char",{p_code:code,p_patch:patch}));return;}
  CH[slot]={...CH[slot],data:merge(CH[slot].data,patch)};render();
  q(()=>rpc("narr_set_char",{p_token:TOKEN,p_slot:slot,p_patch:patch}));
}
function addLog(text,who){
  const e={g:S.gid,ts:Date.now(),who:who||"",text};RAWLOG=[e,...RAWLOG];render();
  if(role==="narr")q(()=>rpc("narr_log",{p_token:TOKEN,p_who:who||"",p_text:text,p_gid:S.gid}));
  else q(()=>rpc("player_log",{p_code:anyCode(),p_who:who||"",p_text:text}));
}

function captain(){if(captainOn!==null)return captainOn;return Object.values(S.hel).some(h=>h&&/capitan/i.test(h.name));}
function pilot(){if(pilotOn!==null)return pilotOn;return Object.values(S.hel).some(h=>h&&/pilot/i.test(h.name));}
function members(){
  const out=[];
  if(isNarr){SLOTS.forEach(k=>{const s=invOf(k);if(s)out.push({id:k,label:CL[s.cls].n,s});});
    Object.entries(S.hel).forEach(([k,h])=>{if(h)out.push({id:k,label:h.name,h});});}
  else Object.values(MY).forEach(s=>out.push({id:s.slot,label:CL[s.cls].n,s}));
  return out;
}

async function doRoll2(){

  if(f.mode==="libero"){
    const n={d6:1,"2d6":2,"3d6":3,d3:1,d2:1}[f.expr];dice=[];

    if(f.expr==="3d6")res=`alto ${Math.max(...dice)}, basso ${Math.min(...dice)}`;
  }else{
    const lab={attacco:"attacco",difesa:"difesa",sanita:"test di Sanità",sapere:"test di Conoscenza",occulto:"test di Occulto"}[f.mode];dice=f.ex?await getEx(`${who}: ${lab}`):[await getD6(`${who}: ${lab}`)];const wm=m&&m.s?(f.weapon==="u"?-1:((armsOf(m.s)[+f.weapon||0]||{}).mod||0)):(m&&m.h?0:(+f.weapon||0));const mod=(+f.mod||0)+(f.mode==="attacco"?wm:0);
    total=dice.reduce((a,b)=>a+b,0)+mod;const T=Math.max(1,+f.target||1);const ms2=mod>=0?"+"+mod:mod;
    if(f.mode==="attacco"){const hits=Math.floor(total/T);const incOk=m&&m.s&&CL[m.s.cls].inc;const w=f.inc&&!incOk?Math.floor(hits/2):hits;
      text=`Attacco vs L${T}${f.inc?" incorporeo":""} (${ms2})`;res=hits===0?"Mancato":`${hits} ${hits>1?"colpi":"colpo"} → ${w} ${w===1?"ferita":"ferite"}`;var _apply=f.fid&&w>0?[f.fid,w]:null;}
    else if(f.mode==="difesa"){text=`Difesa vs L${T} (${ms2})`;res=total>=T?"Schivato":"Colpito";}

  }
  const ok=/Superato|Schivato/.test(res)||/→ [1-9]/.test(res)?true:/Fallito|Colpito|Mancato|→ 0/.test(res)?false:null;
  upd({last:{who,text,total,res,ok,dice,ts:Date.now()}});
  addLog(`${text}: ${total} [${dice.join("+")}]${res?" — "+res:""}`,who);
  if(typeof _apply!=="undefined"&&_apply)applyAttack(_apply[0],_apply[1],who);
}

function mkArm(n,c,m){return {name:n,cat:c,mod:m!=null?m:CATMOD[c]};}
function armsOf(s){return Array.isArray(s.arms)?s.arms:(ARMS[s.cls]||[]).map(a=>mkArm(a[0],a[1],a[2]));}
function maxArms(s){return s.cls==="gangster"?3:2;}
function canCarry(s,w){const a=armsOf(s);
  if(!PREF[s.cls].includes(w.cat))return "categoria non tra le preferite";
  if(a.some(x=>x.name.toLowerCase()===w.name.toLowerCase()))return "ha già quest'arma";
  if(a.length>=maxArms(s))return `porta già ${maxArms(s)} armi`;return "";}
function alive(s){return s&&s.life>0&&s.san>0;}
function locData(l){return LIB.locs&&LIB.locs[l]||null;}
function usedOf(l,n){const v=S.checks[l]&&S.checks[l][n];return v===true?1:(+v||0);}
function recUsed(l,id){return (S.recUsed&&S.recUsed[l]&&S.recUsed[l][id])||0;}
function helpers(){return Object.entries(S.hel).filter(([,h])=>h&&h.name);}
function slotsWith(){return SLOTS.filter(k=>invOf(k));}

      combat:{on:true,round:1,init:false,flee:false,assign:clearMap(S.combat&&S.combat.assign),cres:clearMap(S.combat&&S.combat.cres)}};

  delArm(i){locEdit.arms.splice(+i,1);render();},

  /* ---------- investigate ---------- */

  recruit(id){
    const L=locData(S.loc);const e=L&&L.rec.find(r=>r.id===id);if(!e||S.final)return;

      if(!swap){for(let i=0;i<n;i++)make(i,lf,sn);done();return;}

        modal={title:`${e.name}${n>1?` ${i+1} di ${n}`:""}`,text:"Scegli come distribuire Vita e Sanità.",ok:`${lf} Vita · ${sn} Sanità`,okPlain:true,

      addLog(`Reclutamento a ${S.loc} (+${days} ${days>1?"giorni":"giorno"}${useSpy?", grazie alla Spia":""}). Giorno ${S.day}.`);
    }
  },
  student(){
    const p=SLOTS.find(k=>{const s=invOf(k);return s&&s.cls==="professore"&&alive(s)&&(s.used.studente||0)<s.lvl;});

  equipClose(){equipOpen=false;render();},
  take(slot,i){const s=invOf(slot);const w=locData(S.loc).arms[+i];const arm=mkArm(w.name,w.cat,w.name.match(/tommy/i)?3:undefined);
    if(canCarry(s,arm))return;invUpd(slot,{arms:[...armsOf(s),arm]});addLog(`${CL[s.cls].n} prende: ${w.name}.`);},
  dropArm(slot,i){const s=invOf(slot);const a=armsOf(s).slice();const w=a.splice(+i,1)[0];invUpd(slot,{arms:a});if(w)addLog(`${CL[s.cls].n} lascia: ${w.name}.`);},
  addArmManual(slot){const n=($("#an-"+slot).value||"").trim();const c=$("#ac-"+slot).value;if(!n)return;const s=invOf(slot);const arm=mkArm(n,c,/tommy/i.test(n)?3:undefined);
    const why=canCarry(s,arm);if(why){alertBox(`${CL[s.cls].n} non può prenderla: ${why}.`);return;}invUpd(slot,{arms:[...armsOf(s),arm]});},

  /* ---------- group sanity test ---------- */
  async sanityAll(){
    const D=Math.max(1,+sanDiff||4);const out=[];const hp={};const sel=S.combat&&S.combat.helpers||{};
    const who=[];SLOTS.forEach(k=>{const s=invOf(k);if(alive(s))who.push({k,name:CL[s.cls].n,kind:"inv"});});
    helpers().forEach(([k,h])=>{if(sel[k]===false||h.life<=0||!(h.smax>0)||h.san<=0)return;who.push({k,name:h.name,kind:"hel"});});
    // collect every roll first: cancelling a physical-dice prompt leaves nothing half applied
    try{for(const w of who){const r=await getEx(`Test di Sanità ${D}: ${w.name}`);w.t=r.reduce((a,b)=>a+b,0);}}catch(e){return;}
    who.forEach(w=>{const ok=w.t>=D;if(!ok){if(w.kind==="inv"){const s=invOf(w.k);invUpd(w.k,{san:s.san-1});}else{const h=S.hel[w.k];hp[w.k]={san:h.san-1};}}out.push({k:w.k,name:w.name,t:w.t,ok,kind:w.kind});});
    if(Object.keys(hp).length)upd({hel:hp});
    lastSan={D,out,ts:Date.now()};
    const fails=out.filter(o=>!o.ok).map(o=>o.name);
    upd({last:{who:"",text:`Test di Sanità ${D} per tutti`,total:`${out.length-fails.length}/${out.length}`,res:fails.length?`Falliti: ${fails.join(", ")}`:"Tutti superati",ok:!fails.length,ts:Date.now()}});
    addLog(`Test di Sanità ${D}: ${out.map(o=>`${o.name} ${o.t} ${o.ok?"ok":"−1"}`).join(", ")}.`);
  },
  comfort(i){const o=lastSan&&lastSan.out[+i];if(!o||o.ok||o.comf)return;
    const n=SLOTS.find(k=>{const s=invOf(k);return s&&s.cls==="infermiera"&&alive(s)&&(s.used.conforto||0)<s.lvl;});if(!n)return;
    invUpd(n,{used:{conforto:(invOf(n).used.conforto||0)+1}});
    if(o.kind==="inv"){const s=invOf(o.k);invUpd(o.k,{san:Math.min(maxS(s),s.san+1)});}else{const h=S.hel[o.k];upd({hel:{[o.k]:{san:Math.min(h.smax,h.san+1)}}});}
    o.comf=true;addLog(`L'Infermiera conforta ${o.name}: nessuna Sanità persa.`);render();},

  /* ---------- guided combat ---------- */
  combatStart(){upd({combat:{on:true,round:1,init:false,flee:false,assign:clearMap(S.combat&&S.combat.assign),cres:clearMap(S.combat&&S.combat.cres)}});addLog("Inizia il combattimento.");},
  toggleInit(){upd({combat:{init:!(S.combat&&S.combat.init)}});},
  toggleHel(k){const cur=S.combat&&S.combat.helpers||{};upd({combat:{helpers:{[k]:cur[k]===false}}});},
  assign(flee){
    const A2=computeAssign();
    upd({combat:{assign:{...clearMap(S.combat.assign),...A2},cres:clearMap(S.combat.cres),flee:!!flee}});
    addLog(flee?"Il gruppo tenta la fuga: i nemici attaccano un'ultima volta.":`Round ${S.combat.round}: i nemici attaccano.`);
  },
  async defend(aid){
    const a=S.combat.assign[aid];if(!a)return;if(S.combat.cres&&S.combat.cres[aid]&&S.combat.cres[aid].done)return;
    const tgtInv=SLOTS.includes(a.tgt);const s=tgtInv?invOf(a.tgt):S.hel[a.tgt];
    if(!s||s.life<=0){markRes(aid,"annullato (bersaglio fuori gioco)");return;}
    let r;try{r=await getEx(`${a.tname}: difesa contro ${a.fname} (serve ${a.L})`);}catch(e){return;}const t=r.reduce((x,y)=>x+y,0);const ok=t>=a.L;
    const res=ok?`Schivato (${t})`:`Colpito (${t}): −${a.dmg} Vita`;
    if(!ok){if(tgtInv)invUpd(a.tgt,{life:Math.max(0,s.life-a.dmg)});else if(isNarr)upd({hel:{[a.tgt]:{life:Math.max(0,s.life-a.dmg)}}});}
    markRes(aid,res);
    upd({last:{who:a.tname,text:`Difesa vs ${a.fname} L${a.L}`,total:t,res:ok?"Schivato":"Colpito",ok,dice:r,ts:Date.now()}});
    addLog(`${a.tname} si difende da ${a.fname} (L${a.L}): ${t} [${r.join("+")}] — ${ok?"schivato":"colpito, −"+a.dmg+" Vita"}.`,a.tname);
  },
  nextRound(){upd({combat:{round:(S.combat.round||1)+1,assign:clearMap(S.combat.assign),cres:clearMap(S.combat.cres),flee:false}});addLog(`Round ${S.combat.round}.`);},
  endFlee(){const o={};Object.keys(S.foes).forEach(k=>o[k]=null);upd({foes:o,combat:{on:false,flee:false,assign:clearMap(S.combat.assign),cres:clearMap(S.combat.cres)}});addLog("Il gruppo è fuggito: niente ricompense dall'incontro.");}
};
function clearMap(m){const o={};Object.keys(m||{}).forEach(k=>o[k]=null);return o;}
function markRes(aid,res){upd({combat:{cres:{[aid]:{done:true,res}}}});}
function alertBox(t){modal={title:"Attenzione",text:t,ok:"Ok",fn:()=>{}};render();}

/* Distribute enemy attacks as evenly as possible; extra attacks go to whoever has the most Life. Helpers never face Bosses. */
function computeAssign(){
  const sel=S.combat&&S.combat.helpers||{};
  const T=[];
  SLOTS.forEach(k=>{const s=invOf(k);if(alive(s))T.push({id:k,name:CL[s.cls].n,inv:true,life:s.life,c:0});});
  helpers().forEach(([k,h])=>{if(sel[k]===false||h.life<=0||(h.smax>0&&h.san<=0))return;T.push({id:k,name:h.name,inv:false,life:h.life,c:0});});
  const atk=[];
  Object.entries(S.foes).forEach(([fid,f])=>{if(!f||!f.name||f.n<=0)return;
    const times=f.kind==="Boss"?Math.max(1,+f.atk||1):f.n;
    for(let i=0;i<times;i++)atk.push({fid,fname:f.name,L:f.L,dmg:Math.max(1,+f.dmg||1),boss:f.kind==="Boss"&&!f.hel});});
  atk.sort((a,b)=>b.boss-a.boss);
  const out={};let i=0;
  atk.forEach(a=>{const pool=T.filter(t=>a.boss?t.inv:true);if(!pool.length)return;
    const minc=Math.min(...pool.map(t=>t.c));const cand=pool.filter(t=>t.c===minc).sort((x,y)=>y.life-x.life);const t=cand[0];t.c++;
    out["a"+(i++)+uid().slice(0,3)]={...a,tgt:t.id,tname:t.name};});
  return out;
}

/* ---------- attack auto-apply (called from doRoll) ---------- */
function applyAttack(fid,wounds,who){
  const f=S.foes[fid];if(!f||!f.name||wounds<=0||f.n<=0)return;
  const kill=Math.min(wounds,f.n);const v=f.n-kill;const patch={foes:{[fid]:{n:v}}};
  let msg=`${f.name}: ${f.kind==="Boss"?"−"+kill+" Vita":kill+" abbattuti"}`;
  if(f.kind==="Minion"){let m=S.minions+kill,xp=S.xp,c=0;while(m>=10){m-=10;xp++;c++;}patch.minions=m;patch.xp=xp;if(c)msg+=`; ${c*10} seguaci diventano ${c} PE`;}
  if(f.kind==="Boss"&&v===0){patch.xp=(patch.xp!=null?patch.xp:S.xp)+1;msg+=". Sconfitto! +1 PE";}
  else if(v===0)msg+=". Tutti sconfitti";
  else if(f.kind==="Vermin"&&v<f.n0/2&&f.n>=f.n0/2)msg+=". Hanno perso più di metà del gruppo e fuggono";
  upd(patch);addLog(msg+".",who);
}

/* ---------- configurable boss: each condition lowers (or raises) Level or Life ---------- */
function bossCondOn(c){
  if(c.kind==="cls")return SLOTS.some(k=>{const v=invOf(k);return v&&v.cls===c.cls&&alive(v);});
  return !!(S.bossSel&&S.bossSel[S.loc]&&S.bossSel[S.loc][c.id]);
}
function bossCalc(B){let L=+B.L||1,life=+B.life||1;const parts=[];
  (B.conds||[]).forEach(c=>{if(!bossCondOn(c))return;const m=+c.mod||0;if(c.target==="life")life+=m;else L+=m;
    parts.push(`${c.label||(CL[c.cls]?CL[c.cls].n+" nel gruppo":"condizione")} ${m>0?"+":""}${m} ${c.target==="life"?"Vita":"Livello"}`);});
  return {L:Math.max(1,L),life:Math.max(1,life),parts};}
function bossCard(L){const B=L.boss;if(!B)return "";const r=bossCalc(B);
  return `<div class="card" style="border-color:#f09595"><div class="row sb"><h3 class="hcard">${foeBadge({kind:"Boss",inc:B.inc})}${esc(B.name||"Boss")}</h3>
    <span class="stat">Livello <b class="ko">${r.L}</b><span class="muted">/${B.L}</span> · Vita <b class="ko">${r.life}</b><span class="muted">/${B.life}</span></span></div>
    ${B.note?`<p class="muted">${esc(B.note)}</p>`:""}
    ${(B.conds||[]).length?`<div class="bosslist">${B.conds.map(c=>{const on=bossCondOn(c);const lab=c.label||(CL[c.cls]?CL[c.cls].n+" nel gruppo":"");const val=`${c.mod>0?"+":""}${c.mod} ${c.target==="life"?"Vita":"Liv."}`;
      return c.kind==="cls"?`<div class="row sb"><span class="hcard">${CL[c.cls]?ico(c.cls,18):""}${esc(lab)} <span class="muted">(automatico)</span></span><span class="${on?"ok":"muted"}">${on?"sì":"no"} → ${on?val:"0"}</span></div>`
        :`<div class="row sb"><label style="flex-direction:row;align-items:center;gap:8px;font-size:15px;color:var(--paper)" for="bc-${c.id}"><input id="bc-${c.id}" type="checkbox" style="width:auto;min-height:0" data-a="s1" data-f="bossTick" data-p="${c.id}" ${on?"checked":""}> ${esc(lab)}</label><span class="${on?"ok":"muted"}">${on?val:"0"}</span></div>`;}).join("")}</div>`:`<p class="muted">Nessuna condizione inserita.</p>`}
    <div class="row"><span class="muted">${B.atk>1?`${B.atk} attacchi per round · `:""}${B.dmg>1?`${B.dmg} ferite per colpo · `:""}${B.inc?"incorporeo · ":""}${B.hel?"gli aiutanti partecipano · ":""}${+B.days?`${B.days} ${B.days>1?"giorni":"giorno"} per tentativo`:""}</span></div>
    <div class="row"><button class="pri" data-a="s1" data-f="bossFight" ${S.combat&&S.combat.on?"disabled":""}>Affronta ${esc(B.name||"il boss")}</button></div></div>`;}

function foeArtKey(x){
  const n=(x.name||"").toLowerCase();
  if(x.kind==="Boss"&&!/cultist|sacerdot|criminal|gangster/.test(n))return "boss";
  if(/spettr|fantasm|spirit|ghost|ombr|anim[ae] |presenz/.test(n)||x.inc)return "ghost";
  if(/cadaver|zomb|rianim|corpse|mort|schelet|undead|mummi/.test(n))return "undead";
  if(/gaunt|alat|notturn|night|pipistrell|bat|volant|uccell/.test(n))return "winged";
  if(/profond|deep|pesce|fish|ibrid|anfib|marin/.test(n))return "fishman";
  if(/ratt|rat|topi|insett|verm|parassit|bug|ragn|serp|cani|segug|lup/.test(n)||x.kind==="Vermin")return "vermin";
  if(/criminal|gangster|teppist|delinquent|bandit|uomin|guard|poliziott|scagnozz|sicari|contrabband/.test(n))return "thug";
  return x.kind==="Boss"?"boss":"cultist";
}

function fitScreen(){
  const m=$("#main");if(!m)return;const g=m.querySelector(".scr");
  if(role!=="screen"||!g){m.style.transform="";m.style.width="";m.style.maxWidth="";if(g)g.style.height="";return;}
  const head=document.querySelector("header.top");const W=document.documentElement.clientWidth;
  const pad=parseFloat(getComputedStyle(m).paddingTop)+parseFloat(getComputedStyle(m).paddingBottom);
  const avail=window.innerHeight-(head?head.offsetHeight:0)-pad-4;
  const wide=W>=900;
  let z=1;m.style.transformOrigin="top left";m.style.maxWidth="none";m.style.transform="";m.style.width=W+"px";
  g.style.height=wide?avail+"px":"";
  if(!wide)return;
  // the grid fills the display exactly; if the left column still overflows, lay out taller and scale down
  const apply=zz=>{m.style.width=(W/zz)+"px";g.style.height=(avail/zz)+"px";m.style.transform=zz===1?"":`scale(${zz})`;};
  const need=()=>Math.max(g.scrollHeight,...[...g.children].map(ch=>ch.offsetTop-g.offsetTop+ch.scrollHeight));
  for(let i=0;i<5;i++){const h=need()*z;if(h<=avail+1)break;z=Math.max(.3,z*avail/h);apply(z);}
  // then grow back in small steps while everything still fits
  for(let i=0;i<15&&z<1;i++){const z2=Math.min(1,z*1.02);apply(z2);if(need()*z2<=avail+1)z=z2;else{apply(z);break;}}
}
window.addEventListener("resize",()=>{if(role==="screen")fitScreen();});

  <div class="card"><h3>Controlli anche un altro personaggio?</h3><p class="muted">Il Narratore può affidartelo dalla sua pagina, oppure puoi inserire qui il suo codice.</p>
    <div class="row"><input id="addcode" maxlength="8" autocomplete="off" autocapitalize="characters" aria-label="Codice di un altro personaggio" placeholder="CODICE" style="flex:1;font-family:var(--mono);letter-spacing:.15em;text-transform:uppercase"><button data-a="addCode">Aggiungi</button></div></div>
  <p class="muted">Gli altri giocatori non vedono la tua Vita, la tua Sanità né il tuo equipaggiamento. Se vuoi che lo sappiano, diglielo.</p>`;
}
function viewTable(){
  const foes=Object.entries(S.foes).filter(([,x])=>x&&x.name&&x.n>0);const hel=Object.entries(S.hel).filter(([,h])=>h);
  return `<div class="card"><h2>Nemici in campo${S.combat&&S.combat.on?` · round ${S.combat.round||1}`:""}</h2>${foes.length?foes.map(([,x])=>`<div class="enemy"><div class="hcard">${foeBadge(x)}<div><b>${esc(x.name)}</b> <span class="muted">L${x.L} · ${kindIt(x.kind)}${x.inc?" · incorporeo":""}</span></div></div><div class="num">${x.n}${x.kind==="Boss"?" Vita":" rimasti"}</div></div>`).join(""):`<p class="muted">Nessun nemico.</p>`}</div>
  <div class="card"><h2>Aiutanti del gruppo</h2>${hel.length?hel.map(([,h])=>`<div class="row sb"><span class="hcard">${ico("helper",18)}<b>${esc(h.name)}</b> <span class="muted">${esc(h.note)}</span></span><span class="num">Vita ${h.life}/${h.lmax} · San ${h.san}/${h.smax}</span></div>`).join(""):`<p class="muted">Nessun aiutante.</p>`}</div>
  ${cluesCard(false)}
  <div class="card"><div class="row sb"><h2>Mappa</h2>${mapLegend()}</div>${mapSvg(null)}</div>`;
}
function viewDice(){
  const f=rollForm;const ms=members();const m=isNarr?ms.find(x=>x.id===f.who):(ms.find(x=>x.id===f.who)||ms[0]);
  let hint="";
  if(m&&m.s){const b=classBonus(m.s),L=m.s.lvl,c=m.s.cls;
    hint=[b?`bonus di classe +${b} agli attacchi`:"",c==="medium"?`+${L} contro i non-morti`:"",c==="spia"?`+${L} contro gli umani`:"",c==="professore"?`+${L} ai test di Conoscenza`:"",
      c==="occultista"?`+${L} ai test di Occulto`:"",c==="detective"?`+${Math.floor(L/2)} a Conoscenza o Occulto`:"",CL[c].inc?"ferisce gli incorporei 1 per colpo":"",
      (c==="veterano"||c==="gangster")?"niente test di Occulto o Conoscenza":""].filter(Boolean).join(" · ");}
  const foes=Object.entries(S.foes).filter(([,x])=>x&&x.name&&x.n>0);
  const modes=[["attacco","Attacco"],["difesa","Difesa"],["sanita","Test di Sanità"],["sapere","Test di Conoscenza"],["occulto","Test di Occulto"],["libero","Tiro libero"]];
  const ck=(id,k,lab)=>`<label style="flex-direction:row;align-items:center;gap:6px" for="${id}"><input id="${id}" type="checkbox" style="width:auto;min-height:0" data-rf="${k}" ${f[k]?"checked":""}> ${lab}</label>`;
  return `<div class="card"><h2>Tira i dadi</h2><p class="muted">Ogni tiro compare in alto e nel diario di tutti. I 6 esplodono nelle azioni dei personaggi.</p>
    <div class="f">${isNarr||ms.length>1?`<label for="rWho">Chi tira<select id="rWho" data-rf="who">${isNarr?`<option value="">Narratore / nessuno</option>`:""}${ms.map(x=>`<option value="${x.id}" ${(m&&m.id===x.id)?"selected":""}>${esc(x.label)}</option>`).join("")}</select></label>`:`<label>Chi tira<input value="${esc(m?m.label:"")}" disabled></label>`}
      <label for="rMode">Tipo<select id="rMode" data-rf="mode">${modes.map(([k,n])=>`<option value="${k}" ${f.mode===k?"selected":""}>${n}</option>`).join("")}</select></label></div>
    ${hint?`<p class="muted">${esc(hint)}</p>`:""}
    ${f.mode==="libero"?`<div class="f"><label for="rExpr">Dadi<select id="rExpr" data-rf="expr">${["d6","2d6","3d6","d3","d2"].map(x=>`<option ${f.expr===x?"selected":""}>${x}</option>`).join("")}</select></label>
      <label for="rMod">Modificatore<input id="rMod" type="number" data-rf="mod" value="${f.mod}"></label></div>`:`
    <div class="f">${f.mode==="attacco"?`<label for="rWeap">Arma<select id="rWeap" data-rf="weapon">${(m&&m.s?[...armsOf(m.s).map((w,i)=>[String(i),`${w.name} (${w.mod>=0?"+":""}${w.mod})`]),["u","Disarmato −1"]]:m&&m.h?[["0",`Arma propria${m.h.atk?" (bonus nei modificatori)":""}`]]:[["-1","Disarmato −1"],["0","Normale +0"],["1","Potente / Lanciafiamme +1"],["3","Tommy Gun / Lanciafiamme Veterano +3"]]).map(([val,n])=>`<option value="${val}" ${String(f.weapon)===val?"selected":""}>${esc(n)}</option>`).join("")}</select></label>`:""}
      <label for="rMod">Altri modificatori<input id="rMod" type="number" data-rf="mod" value="${f.mod}"></label>
      <label for="rT">${f.mode==="attacco"||f.mode==="difesa"?"Livello del nemico":"Difficoltà"}<input id="rT" type="number" min="1" data-rf="target" value="${f.target}"></label></div>
    ${f.mode==="attacco"?`<div class="row">${ck("rInc","inc","Bersaglio incorporeo (2 colpi = 1 ferita)")}</div>
      ${foes.length?`<label for="rFid">Bersaglio (le ferite vengono tolte da sole)<select id="rFid" data-rf="fid"><option value="">— nessuno, segno a mano —</option>${foes.map(([k,x])=>`<option value="${k}" ${f.fid===k?"selected":""}>${esc(x.name)} L${x.L}${x.inc?" incorporeo":""} (${x.n})</option>`).join("")}</select></label>`:""}`:""}
    <div class="row">${ck("rEx","ex","6 esplosivi")}</div>`}
    <div class="row"><button class="pri" data-a="roll">Tira</button>${m&&m.s&&f.mode==="attacco"&&classBonus(m.s)?`<button class="sm" data-a="classMod">Metti il bonus di classe (+${classBonus(m.s)})</button>`:""}</div></div>`;
}
function viewCombat(){
  const foes=Object.entries(S.foes).filter(([,x])=>x&&x.name);
  return `<div class="card"><div class="row sb"><h2>Nemici</h2>${foes.length?`<button class="danger sm" data-a="endCombat">Fine combattimento</button>`:""}</div>
    ${foes.length?foes.map(([k,x])=>`<div class="enemy"><div class="hcard">${foeBadge(x)}<div><b>${esc(x.name)}</b> <span class="muted">L${x.L} · ${kindIt(x.kind)}${x.inc?" · incorporeo":""}</span><br>
      <span class="muted">${x.kind==="Boss"?"Vita":"Rimasti"}:</span> <span class="num ${x.n===0?"ko":""}">${x.n}</span><span class="muted num"> / ${x.n0}</span>${x.kind==="Vermin"&&x.n>0&&x.n<x.n0/2?` <span class="chip dead">fuggono</span>`:""}</div></div>
      <div class="row"><button data-a="foe" data-p="${k}" data-d="-1">${x.kind==="Boss"?"−1 Vita":"−1 sconfitto"}</button><button class="sm" data-a="foe" data-p="${k}" data-d="1" aria-label="aggiungi">+</button><button class="sm" data-a="delFoe" data-p="${k}" aria-label="togli">×</button></div></div>`).join(""):`<p class="muted">Nessun nemico in campo. I giocatori vedono i nemici nella scheda Tavolo.</p>`}
  </div>
  <div class="card"><h3>Aggiungi nemici</h3><div class="f">
    <label for="fName">Nome<input id="fName" placeholder="Cultisti"></label>
    <label for="fKind">Tipo<select id="fKind"><option value="Minion">Seguaci (1 Vita, 10 = 1 PE)</option><option value="Vermin">Infestanti (1 Vita, niente PE)</option><option value="Boss">Boss</option></select></label>
    <label for="fL">Livello<input id="fL" type="number" min="1" value="3"></label>
    <label for="fN">Quanti / Vita del boss<input id="fN" type="number" min="1" value="3"></label>
    <label for="fAtk">Attacchi per round (boss)<input id="fAtk" type="number" min="1" value="1"></label>
    <label for="fDmg">Ferite per colpo<input id="fDmg" type="number" min="1" value="1"></label></div>
    <div class="row"><label style="flex-direction:row;align-items:center;gap:6px" for="fInc"><input id="fInc" type="checkbox" style="width:auto;min-height:0"> Incorporei</label><button class="pri" data-a="addFoe">Aggiungi</button></div>
    <div class="row"><span class="muted">PE e seguaci:</span><button class="sm" data-a="minion" data-p="1">+1 seguace</button><button class="sm" data-a="xp" data-p="1">+1 PE</button><button class="sm" data-a="xp" data-p="-1">−1 PE</button></div></div>`;
}

const PORTS=["Innsmouth","Kingsport","Boston","New York","New Orleans"];

const LABEL_T={"St. Louis|New Orleans":.3,"Chicago|New Orleans":.35,"San Francisco|New York":.62,"St. Louis|San Francisco":.5,"New York|New Orleans":.45,"New Orleans|Palude di Big Cypress":.3};
const ANCHOR='<path d="M0-9v17M-5-4h10M-8 2c1 6 4 8 8 8s7-2 8-8"/><circle cy="-11" r="2.6"/>';
const PLANE='<path d="M0-11c2 0 2.5 2 2.5 4v4l9 5v3l-9-2.5v5l3 2.5v2.5L0 11l-5.5 1.5V10l3-2.5v-5l-9 2.5v-3l9-5v-4c0-2 .5-4 2.5-4z" fill="currentColor"/>';
function hubIcons(l,x,y){const ic=[];if(PORTS.includes(l))ic.push(ANCHOR);if(AIR.includes(l))ic.push(PLANE);
  return ic.map((g,i)=>`<g transform="translate(${x+30+i*30} ${y+22})" color="#e6dcc6" stroke="#e6dcc6" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle r="15" fill="#15121c" stroke="#8a7bb0" stroke-width="2"/>${g}</g>`).join("");}
function mapLegend(){return `<span class="maplegend"><svg width="16" height="16" viewBox="-14 -14 28 28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">${ANCHOR}</svg> porto <svg width="16" height="16" viewBox="-14 -14 28 28" aria-hidden="true">${PLANE}</svg> aeroporto</span>`;}
function mapSvg(r){
  const onPath=new Set();if(r)for(let i=0;i<r.path.length-1;i++){onPath.add(r.path[i]+"|"+r.path[i+1]);onPath.add(r.path[i+1]+"|"+r.path[i]);}
  let svg=`<svg class="map" viewBox="80 170 1060 1290" role="img" aria-label="Mappa dei luoghi con i giorni di viaggio, porti e aeroporti">${MAP_BG}`;
  let labels="";
  EDGES.forEach(([a,b,d])=>{const [x1,y1]=POS[a],[x2,y2]=POS[b];const hot=onPath.has(a+"|"+b);
    svg+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${hot?"#d6b25e":"#8a7bb0"}" stroke-width="${hot?8:5}" stroke-linecap="round"/>`;
    const t=LABEL_T[a+"|"+b]||LABEL_T[b+"|"+a]||.5;const lx=x1+(x2-x1)*t,ly=y1+(y2-y1)*t;
    labels+=`<text x="${lx}" y="${ly+10}" font-size="28" text-anchor="middle" stroke="#15121c" stroke-width="7" paint-order="stroke" stroke-linejoin="round" style="fill:${hot?"#d6b25e":"#e6dcc6"};font-weight:600">${d}</text>`;});
  if(r)for(let i=0;i<r.path.length-1;i++){const a=r.path[i],b=r.path[i+1];if(!EDGES.some(([x,y])=>(x===a&&y===b)||(x===b&&y===a))){const [x1,y1]=POS[a],[x2,y2]=POS[b];svg+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#d6b25e" stroke-width="5" stroke-dasharray="14 10"/>`;}}
  svg+=labels;
  LOCS.forEach(l=>{const [x,y]=POS[l];const cur=l===S.loc,dst=l===travelTo;
    svg+=`<g data-a="pick" data-p="${esc(l)}" style="cursor:${isNarr?"pointer":"default"}"><circle cx="${x}" cy="${y}" r="${cur?22:16}" fill="${cur?"#b9a3f0":dst?"#d6b25e":"#1f1a2a"}" stroke="#b9a3f0" stroke-width="3"/>${hubIcons(l,x,y)}<text x="${x}" y="${y-28}" font-size="30" text-anchor="middle" stroke="#15121c" stroke-width="6" paint-order="stroke" stroke-linejoin="round" style="font-weight:${cur?700:400}">${esc(l)}</text></g>`;});
  return svg+`</svg>`;
}
function viewMap(){
  const p=pilot(),cp=captain();const r=travelTo&&S.loc?shortest(S.loc,travelTo,p,cp):null;
  return `<div class="card"><h2>Giorni</h2>
    <div class="row"><span class="stat">Giorno <b>${S.day}</b>/40</span><button class="sm" data-a="day" data-d="-1">−1</button><button class="sm" data-a="day" data-d="1">+1</button>
      <button class="sm ${S.final?"pri":""}" data-a="final">${S.final?"Incontro finale in corso":"Inizia l'incontro finale"}</button></div>
    <div class="row">${ACTS.map(([n,d],i)=>`<button class="sm" data-a="activity" data-p="${i}" ${S.final?"disabled":""}>${n} (+${d})</button>`).join("")}</div>
    ${S.day>=40&&!S.final?`<p class="banner ko">Sono passati 40 giorni senza Incontro finale: il rituale si compie.</p>`:""}</div>
  <div class="grid2"><div class="card"><h2>Viaggio</h2>
    <p class="muted">Tocca un luogo per calcolare il percorso più breve. ${mapLegend()}</p>
    <div class="row"><label style="flex-direction:row;align-items:center;gap:6px" for="pil"><input id="pil" type="checkbox" style="width:auto;min-height:0" data-a="togglePilot" ${p?"checked":""}> Pilota d'aereo nel gruppo (aeroporti a 1 giorno)</label>
      <label style="flex-direction:row;align-items:center;gap:6px" for="cap"><input id="cap" type="checkbox" style="width:auto;min-height:0" data-a="toggleCaptain" ${cp?"checked":""}> Capitano di mare nel gruppo (New York, Boston, Kingsport, Innsmouth a 1 giorno; New York–New Orleans 2 giorni)</label></div>
    ${r?`<div class="result">${esc(r.path.join(" → "))}<br><b class="num">${r.days}</b> ${r.days>1?"giorni":"giorno"} · arrivo al giorno <b class="num">${S.day+r.days}</b></div>
      <div class="row"><button class="pri" data-a="travel">Viaggia fino a ${esc(travelTo)}</button><button data-a="setLocTo">Sposta senza contare i giorni</button></div>`:`<p class="muted">Nessuna destinazione scelta.</p>`}
    ${mapSvg(r)}</div>
  <div class="card"><h2>Caselle spuntate</h2>
    <div class="checks">${CHECKLOCS.map(l=>`<div class="loc"><b style="font-size:14px">${esc(l)}</b><div class="bx">${[1,2,3,4,5,6].map(i=>`<button class="${S.checks[l]&&S.checks[l][i]?"on":""}" data-a="check" data-p="${esc(l)}" data-k="${i}" aria-label="${esc(l)} incontro ${i}">${i}</button>`).join("")}</div></div>`).join("")}</div>
    <label for="gnotes">Note del Narratore (reclute usate, effetti di “domani”…)<textarea id="gnotes" data-gtx="notes">${esc(S.notes)}</textarea></label></div></div>`;
}
function viewLog(){
  const LOG=RAWLOG.filter(e=>S&&e.g===S.gid).sort((a,b)=>b.ts-a.ts);
  return `<div class="card"><h2>Diario</h2>
    <div class="row"><input id="lognote" placeholder="Scrivi un evento o una nota per tutti" style="flex:1"><button class="pri" data-a="note">Aggiungi</button></div>
    <ul class="log">${LOG.length?LOG.map(e=>`<li><span class="t">${hhmm(e.ts)}</span>${e.who?`<span class="w">${esc(e.who)}</span>`:""}${esc(e.text)}</li>`).join(""):`<li class="muted">Il diario è vuoto.</li>`}</ul></div>`;
}


/* ---------- events ---------- */
const OPEN_OK=new Set(["createGame","narrLogin","playerLogin","logout","modalOk","modalAlt","modalNo","tab"]);
const PLAYER_OK=new Set(["addCode","stat","ctr","levelUp","roll","note","target","classMod"]);
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-a]");if(!t||t.tagName==="SELECT")return;
  const a=t.dataset.a,p=t.dataset.p,d=+t.dataset.d;
  if(a.startsWith("dk")){diceKey(a,p);return;}
  if(diceReq)return;
  if(a==="scr"){const f=t.dataset.f;if(SCR[f])SCR[f]();return;}
  if(a==="s1"){const f=t.dataset.f,k=t.dataset.k;if(!role||!S1[f])return;
    if(!isNarr){if(!["defend","dropArm","addArmManual"].includes(f))return;
      if(f==="defend"){const as=S.combat&&S.combat.assign&&S.combat.assign[p];if(!as||!MY[as.tgt])return;}
      else if(!MY[p])return;}
    S1[f](p,k);return;}
  if(!OPEN_OK.has(a)){
    if(!role)return;
    if(!isNarr&&!PLAYER_OK.has(a))return;
    if(!isNarr&&["stat","ctr","levelUp"].includes(a)&&!MY[p])return;
  }
  switch(a){
    case "stat":A.stat(p,t.dataset.f,d);break;
    case "helStat":A.helStat(p,t.dataset.f,d);break;
    case "ctr":A.ctr(p,t.dataset.k,d);break;
    case "day":A.day(d);break;
    case "foe":A.foe(p,d);break;
    case "activity":A.activity(+p);break;
    case "check":A.check(p,t.dataset.k);break;
    case "minion":A.minion(+p);break;
    case "xp":A.xp(+p);break;
    case "unassign":A.assign(p,null);break;
    case "target":{const x=S.foes[p];rollForm.target=x.L;rollForm.inc=!!x.inc;render();break;}
    case "classMod":{const ms=members();const m=ms.find(x=>x.id===rollForm.who)||(isNarr?null:ms[0]);if(m&&m.s){rollForm.mod=classBonus(m.s);render();}break;}
    default:if(A[a])A[a](p);
  }
});
document.addEventListener("change",e=>{
  const t=e.target,p=t.dataset.p;if(!role)return;
  if(t.dataset.le&&locEdit){if(/^(sub\.)?(min|max)$/.test(t.dataset.le))render();return;}
  if(t.dataset.tx){if(!isNarr&&!MY[p])return;invUpd(p,{[t.dataset.tx]:t.value});return;}
  if(!isNarr)return;
  if(t.dataset.ch==="roster"){A.pickRoster(p,t.value);return;}
  if(t.dataset.ch==="addInv"){A.addInv(p,t.value);return;}
  if(t.dataset.ch==="assign"){if(t.value)A.assign(p,t.value);return;}
  if(t.dataset.htx){upd({hel:{[p]:{[t.dataset.htx]:t.value}}});return;}
  if(t.dataset.hnum){const v=Math.max(0,+t.value||0),f=t.dataset.hnum,cur=f==="lmax"?"life":"san";upd({hel:{[p]:{[f]:v,[cur]:Math.min(S.hel[p][cur],v)}}});return;}
  if(t.dataset.gtx){upd({[t.dataset.gtx]:t.value});}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="dkIn"){const c=t.value.replace(/[^0-9]/g,"");if(c!==t.value)t.value=c;return;}
  if(t.dataset.le&&locEdit){const path=t.dataset.le.split(".");let o=locEdit;for(let i=0;i<path.length-1;i++)o=o[path[i]];o[path[path.length-1]]=t.value;return;}
  if(t.dataset.s1v){if(t.dataset.s1v==="invMod")invMod=+t.value||0;else sanDiff=+t.value||4;return;}
  if(!t.dataset.rf)return;const k=t.dataset.rf;rollForm[k]=t.type==="checkbox"?t.checked:t.value;
  if(k==="fid"){const x=S.foes[t.value];if(x){rollForm.target=x.L;rollForm.inc=!!x.inc;}render();return;}
  if(k==="who"||k==="mode"){rollForm.weapon="0";const ms=members();const m=ms.find(x=>x.id===rollForm.who)||(isNarr?null:ms[0]);rollForm.mod=rollForm.mode==="attacco"&&m?(m.s?classBonus(m.s):(+m.h.atk||0)):0;render();}
});
document.addEventListener("keydown",e=>{
  if(diceReq&&!diceReq.other&&/^[1-9]$/.test(e.key)){diceKey("dk",e.key);return;}
  if(e.key!=="Enter")return;
  const id=e.target.id;
  if(id==="dkIn"){e.preventDefault();diceKey("dkOk");return;}
  if(id==="lognote"){e.preventDefault();A.note();}
  if(id==="pcode"){e.preventDefault();A.playerLogin();}
  if(id==="addcode"){e.preventDefault();A.addCode();}
  if(id==="ntok"){e.preventDefault();A.narrLogin();}
  if(id==="vcode"){e.preventDefault();SCR.login();}
});

/* ---------- boot ---------- */
function conn(txt,cls){$("#conn").textContent=txt;$("#conn").className="chip "+(cls||"");}
(function boot(){
  if(!window.supabase||!window.supabase.createClient){conn("libreria non caricata","dead");landingErr="Non riesco a caricare la libreria di Supabase: controlla la connessione e ricarica la pagina.";render();return;}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
  // a ?codice=XXXXXX link opens straight into the player's sheet
  const qs=new URLSearchParams(location.search);const qc=(qs.get("codice")||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  DEV=lsGet("4agoo-dev");if(!DEV){DEV=uid()+uid();lsSet("4agoo-dev",DEV);}
  TOKEN=lsGet("4agoo-narr");
  try{CODES=JSON.parse(lsGet("4agoo-codes")||"{}")||{};}catch(e){CODES={};}
  const legacy=lsGet("4agoo-code");if(legacy&&!Object.keys(CODES).length)CODES={"?":legacy};
  if(qc){if(!Object.values(CODES).includes(qc))CODES={"?":qc};saveCodes();TOKEN=null;}
  const qv=(qs.get("schermo")||"").toUpperCase().replace(/[^A-Z0-9]/g,"");VIEW=qv||lsGet("4agoo-view");if(qv){lsSet("4agoo-view",qv);}
  if(qv&&!qc){role="screen";isNarr=false;mode="loading";}
  else if(TOKEN){role="narr";isNarr=true;mode="loading";}
  else if(Object.keys(CODES).length){role="player";isNarr=false;mode="loading";tab="pg";}
  else if(VIEW){role="screen";isNarr=false;mode="loading";}
  conn(role?"connessione…":"pronto","");
  render();if(role)refetch();
  setInterval(()=>{if(role&&document.visibilityState==="visible")refetchSoon(0);},15000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&role)refetchSoon(0);});
})();

</script>
